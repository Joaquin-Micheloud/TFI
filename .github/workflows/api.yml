# Compila la API y la publica en Azure App Service en cada push a main que toque api/.
# Configuración (una sola vez), en GitHub → Settings → Secrets and variables → Actions:
#   - Variable AZURE_API_APP_NAME: el nombre de la aplicación web (ej.: quilatear-api-micheloud)
#   - Secreto AZURE_API_PUBLISH_PROFILE: el contenido del perfil de publicación de esa aplicación
# Mientras la variable no exista, el workflow no hace nada.
name: Deploy API

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: ${{ vars.AZURE_API_APP_NAME != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # prisma generate no se conecta a la base, pero prisma.config.ts lee la variable
      DATABASE_URL: postgresql://x:x@localhost:5432/x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - run: npm prune --omit=dev

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: api
